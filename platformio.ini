; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Library options: dependencies, extra library storages
;
; Before the first build, copy include/secrets.h.example to include/secrets.h
; and fill in your WiFi and OTA credentials.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall
	-Wextra
lib_deps =
	janelia-arduino/TMC2209@^10.1.0
	gin66/FastAccelStepper@^0.33.3
	bblanchon/ArduinoJson@^7.4.2

; Normal build: only info_* logging is compiled in.
[env:esp32-s3-devkitm-1]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Verbose build: enables all dbg_* tracing. Noticeably slower and chattier.
[env:esp32-s3-devkitm-1-debug]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
	${env.build_flags}
	-DDEBUG

; Wireless update. Hold SW1 while resetting the board to put it into OTA mode.
[env:esp32-s3-devkitm-1-ota]
upload_protocol = espota
upload_port = BratenDreher.local
upload_flags =
    --port=3232
